<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhãn Lưu Mẫu - Khổ A5</title>
  <style>
    /* ==========================================
       1. THIẾT LẬP TRANG IN (PAGE SETUP A5)
       ========================================== */
    @page { 
      size: A5 portrait; 
      margin: 0; 
    }
    * { 
      box-sizing: border-box; 
    }
    
    :root { 
      --bg-viewer: #bdd3ef; 
      --paper-bg: #ffffff; 
      --text-color: #000000; 
      --border-color: #000000; 
    }
    
    body.dark-mode { 
      --bg-viewer: #0f172a; 
    }

    body { 
      font-family: "Times New Roman", Times, serif; 
      font-size: 9.5pt; 
      line-height: 1.2; 
      margin: 0; 
      padding: 0; 
      color: var(--text-color); 
      background-color: var(--bg-viewer);
      transition: background-color 0.3s ease;
    }

    /* ==========================================
       2. MODERN UI/UX TOOLBAR
       ========================================== */
    .app-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 55px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    body.dark-mode .app-toolbar {
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .toolbar-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-ui {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    body.dark-mode .btn-secondary {
      background: #334155;
      color: #f8fafc;
    }
    body.dark-mode .btn-secondary:hover {
      background: #475569;
    }

    .zoom-controls {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 6px;
      padding: 2px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
      margin-right: 8px;
    }
    body.dark-mode .zoom-controls {
      background: rgba(255, 255, 255, 0.1);
    }
    .btn-zoom {
      background: transparent;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      color: inherit;
    }
    .btn-zoom:hover {
      background: rgba(0, 0, 0, 0.1);
    }
    body.dark-mode .btn-zoom:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* ==========================================
       3. PAPER CANVAS VIEWER (XEM TRƯỚC A5)
       ========================================== */
    .viewer-container {
      padding-top: 75px;
      padding-bottom: 30px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      overflow-x: auto;
    }

    .page {
      background: var(--paper-bg);
      width: 148mm;
      height: 210mm;
      min-height: 210mm;
      padding: 8mm 10mm;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      border-radius: 2px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      transform-origin: top center;
      transition: transform 0.2s ease;
      page-break-after: avoid;
      page-break-inside: avoid;
      overflow: hidden;
    }

    /* ==========================================
       4. BẢNG NỘI DUNG & CHÂN TRANG KHÔNG KHUNG
       ========================================== */
    .label-card {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    table.main-table { 
      width: 100%; 
      border-collapse: collapse; 
      table-layout: fixed; 
    }
    table.main-table td { 
      border: 0.5px solid var(--border-color); 
      padding: 6px 6px; 
      vertical-align: middle; 
      word-wrap: break-word; 
    }
    
    .header-logo { 
      width: 25%; 
      text-align: center; 
    }
    .header-logo img { 
      max-height: 38px; 
      width: auto; 
      display: block; 
      margin: 0 auto; 
    }

    .text-center { text-align: center; }
    .text-bold { font-weight: bold; }

    /* Dòng chân trang ẩn khung hoàn toàn và nằm dính sát đáy bảng */
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8pt;
      padding: 2px 2px 0 2px;
      border: none !important; /* Ẩn toàn bộ đường viền */
      margin-top: 1px; /* Khoảng cách sát viền dưới của bảng */
      white-space: nowrap;
    }

    /* ==========================================
       5. CSS DÀNH RIÊNG CHỈ KHI IN (PRINT MEDIA)
       ========================================== */
    @media print {
      html, body { 
        width: 148mm; 
        height: 210mm; 
        overflow: hidden !important; 
        background: #ffffff !important; 
        margin: 0 !important; 
        padding: 0 !important; 
      }
      .no-print, .app-toolbar { 
        display: none !important; 
      }
      .viewer-container { 
        padding: 0 !important; 
        margin: 0 !important; 
        display: block !important; 
        min-height: auto !important; 
      }
      .page {
        width: 148mm !important;
        height: 210mm !important;
        min-height: 210mm !important;
        max-height: 210mm !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        padding: 8mm 10mm !important;
        transform: none !important;
        overflow: hidden !important;
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
      }
      table.main-table td { 
        border-color: #747373 !important; 
      }
      .footer-info { 
        border: none !important; 
      }
    }
  </style>
</head>
<body>

  <!-- FIXED TOOLBAR (MODERN UI/UX) -->
  <div class="app-toolbar no-print">
    <div class="toolbar-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      <span>Xem Trước Bản In (Nhãn Lưu Mẫu - Khổ A5)</span>
    </div>
    
    <div class="toolbar-actions">
      <!-- Bộ điều chỉnh Zoom -->
      <div class="zoom-controls">
        <button class="btn-zoom" onclick="zoomOut()" title="Thu nhỏ">-</button>
        <span id="zoom-value" style="padding: 0 6px;">100%</span>
        <button class="btn-zoom" onclick="zoomIn()" title="Phóng to">+</button>
      </div>

      <!-- Đổi Chế Độ Dark Mode -->
      <button class="btn-ui btn-secondary" onclick="toggleDarkMode()">
        <span>🌙 / ☀️ Chế độ</span>
      </button>

      <!-- Nút In / Xuất PDF -->
      <button class="btn-ui btn-primary" onclick="triggerPrint()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 6 2 18 2 18 9"></polyline>
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
          <rect x="6" y="14" width="12" height="8"></rect>
        </svg>
        <span>In Nhãn / Xuất PDF</span>
      </button>
    </div>
  </div>

  <!-- CANVAS KHỔ GIẤY A5 -->
  <div class="viewer-container">
    <div class="page" id="paper-page">

      <div class="label-card">
        <table class="main-table">
          <!-- Dòng 1: Logo & Tiêu đề Nhãn -->
          <tr>
            <td class="header-logo">
              <img src="logo.png" alt="LOGO" onerror="this.src='https://via.placeholder.com/80x40?text=LOGO'">
            </td>
            <td class="text-center text-bold" style="font-size: 13pt;">
              NHÃN LƯU MẪU
            </td>
          </tr>
          <!-- Dòng 2: Số STT -->
          <tr>
            <td colspan="2" style="font-size: 10pt;">
              Số: <b><span id="val-stt">...</span></b> - <span id="val-year">...</span>/ CL
            </td>
          </tr>
          <!-- Dòng 3: Tên mẫu -->
          <tr>
            <td style="width: 28%;">Tên mẫu:</td>
            <td><b><span id="val-ten-sp">...</span></b> &nbsp;&nbsp;&nbsp;&nbsp; (<b><span id="val-ma-tube">...</span></b>)</td>
          </tr>
          <!-- Dòng 4: Khách hàng -->
          <tr>
            <td>Khách hàng:</td>
            <td><b><span id="val-ten-kh">...</span></b></td>
          </tr>
          <!-- Dòng 5: Số lô & Hạn dùng -->
          <tr>
            <td>Số lô sản xuất:</td>
            <td>
              <b><span id="val-so-lo">...</span></b>
              <span style="float: right; margin-right: 80px;">Hạn dùng: <b><span id="val-han-dung">...</span></b></span>
            </td>
          </tr>
          <!-- Dòng 6: Số lượng mẫu -->
          <tr>
            <td>Số lượng mẫu:</td>
            <td><b><span id="val-sl-luu">...</span></b> ống</td>
          </tr>
          <!-- Dòng 7: Ngày lưu mẫu -->
          <tr>
            <td>Ngày lưu mẫu:</td>
            <td><b><span id="val-ngay-luu">...</span></b></td>
          </tr>
          <!-- Dòng 8: Thời gian lưu -->
          <tr>
            <td>Thời gian lưu:</td>
            <td><b><span id="val-tg-luu">...</span></b></td>
          </tr>
          <!-- Dòng 9: Ô Nhân viên lưu mẫu -->
          <tr>
            <td colspan="2" style="height: 90px; font-weight: bold; text-align: right; vertical-align: top; padding: 8px 40px 8px 8px;">
              <div style="display: inline-block; text-align: center;">
                <b>Nhân viên lưu mẫu</b>
                <div style="margin-top: 40px;">
                  <b><span id="val-nv-dbcl">...</span></b>
                </div>
              </div>
            </td>
          </tr>
        </table>

        <!-- Chân trang dính sát khung bảng và KHÔNG CÓ KHUNG -->
        <div class="footer-info">
          <div>M01/QA-SOP 27</div>
          <div>Lần sửa đổi: 00</div>
          <div>Trang 1/1</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // 1. Lấy dữ liệu tham số từ URL
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      for (let [key, value] of urlParams.entries()) {
        if (key.toLowerCase() === param.toLowerCase()) {
          try { return decodeURIComponent(value) || '...'; } catch(e) { return value || '...'; }
        }
      }
      return '...';
    }

    // 2. Chuyển đổi định dạng ngày về DD/MM/YYYY
    function formatDate(dateStr) {
      if (!dateStr || dateStr === '...') return '...';
      
      const cleanStr = dateStr.trim().split('T')[0].split(' ')[0];

      if (/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(cleanStr)) {
        const parts = cleanStr.split(/[-/]/);
        return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
      }

      const d = new Date(cleanStr);
      if (!isNaN(d.getTime())) {
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      }

      return dateStr;
    }

    // 3. Đổ dữ liệu vào trang HTML
    function fillData() {
      const stt = getQueryParam('stt');
      const year = getQueryParam('year');
      const tenSp = getQueryParam('ten_sp');
      const maTube = getQueryParam('ma_tube');
      const tenKh = getQueryParam('ten_kh');
      const soLo = getQueryParam('so_lo');
      const hanDung = getQueryParam('han_dung');
      const slLuu = getQueryParam('sl_luu');
      const ngayLuu = getQueryParam('ngay_luu');
      const tgLuu = getQueryParam('tg_luu');
      const nvDbcl = getQueryParam('nv_dbcl');

      if(document.getElementById('val-stt')) document.getElementById('val-stt').innerText = stt;
      if(document.getElementById('val-year')) document.getElementById('val-year').innerText = year;
      if(document.getElementById('val-ten-sp')) document.getElementById('val-ten-sp').innerText = tenSp;
      if(document.getElementById('val-ma-tube')) document.getElementById('val-ma-tube').innerText = maTube;
      if(document.getElementById('val-ten-kh')) document.getElementById('val-ten-kh').innerText = tenKh;
      if(document.getElementById('val-so-lo')) document.getElementById('val-so-lo').innerText = soLo;
      if(document.getElementById('val-sl-luu')) document.getElementById('val-sl-luu').innerText = slLuu;
      
      // Giữ nguyên chuỗi văn bản gốc cho Hạn dùng
      if(document.getElementById('val-han-dung')) document.getElementById('val-han-dung').innerText = hanDung;
      
      // Định dạng ngày/tháng/năm cho Ngày lưu mẫu
      if(document.getElementById('val-ngay-luu')) document.getElementById('val-ngay-luu').innerText = formatDate(ngayLuu);
      
      if(document.getElementById('val-tg-luu')) document.getElementById('val-tg-luu').innerText = tgLuu;
      if(document.getElementById('val-nv-dbcl')) document.getElementById('val-nv-dbcl').innerText = nvDbcl;
    }

    // 4. Lệnh in
    function triggerPrint() { 
      try { 
        window.print(); 
      } catch (e) { 
        alert("Bấm Ctrl + P để thực hiện in!"); 
      } 
    }

    // 5. Tính năng Thu Phóng (Zoom)
    let currentZoom = 100;
    function updateZoom() {
      const paper = document.getElementById('paper-page');
      paper.style.transform = `scale(${currentZoom / 100})`;
      document.getElementById('zoom-value').innerText = `${currentZoom}%`;
    }

    function zoomIn() {
      if (currentZoom < 180) {
        currentZoom += 10;
        updateZoom();
      }
    }

    function zoomOut() {
      if (currentZoom > 60) {
        currentZoom -= 10;
        updateZoom();
      }
    }

    // 6. Chế độ Tối (Dark Mode)
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    window.addEventListener('DOMContentLoaded', fillData);
  </script>
</body>
</html>
